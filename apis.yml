aid: shoreline-biosciences
name: Shoreline Biosciences
description: >-
  Shoreline Biosciences was a San Diego, California clinical-stage biotechnology company developing
  off-the-shelf, allogeneic cell therapies from induced pluripotent stem cells (iPSCs), principally
  iPSC-derived natural killer (iNK) cells and macrophages engineered for oncology indications. It
  raised roughly $140M, acquired Editas Medicine's iNK cell franchise and related gene-editing
  technologies in 2023, and signed collaborations with Kite Pharma (Gilead) and BeiGene with headline
  values above $4B. Therapeutics, not software, were the product: no developer program, API, SDK or
  machine-readable specification was ever published. As of this profiling pass the company's own
  domain, shorelinebio.com, no longer serves a website — it answers HTTP 404 with a Squarespace
  "Website Expired" holding page — and the company is tracked here only as a secondary-market entity.
